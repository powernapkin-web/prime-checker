<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Checker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --bg-input: #0d1117;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --prime: #3fb950;
    --composite: #f85149;
    --glow-prime: rgba(63, 185, 80, 0.25);
    --glow-composite: rgba(248, 81, 73, 0.25);
  }

  body {
    font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(88, 166, 255, 0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 50%, rgba(63, 185, 80, 0.03) 0%, transparent 50%);
  }

  .container {
    width: 100%;
    max-width: 480px;
    padding: 24px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 28px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 28px;
  }

  .input-group {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  input[type="number"] {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 1.1rem;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-weight: 500;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input[type="number"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }

  button {
    background: var(--accent);
    color: #0d1117;
    border: none;
    border-radius: 10px;
    padding: 14px 24px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
    font-family: inherit;
  }

  button:hover { opacity: 0.85; }
  button:active { transform: scale(0.97); }

  .result {
    margin-top: 20px;
    padding: 20px;
    border-radius: 10px;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result.prime {
    display: block;
    background: rgba(63, 185, 80, 0.08);
    border: 1px solid rgba(63, 185, 80, 0.25);
  }

  .result.composite {
    display: block;
    background: rgba(248, 81, 73, 0.06);
    border: 1px solid rgba(248, 81, 73, 0.2);
  }

  .result-label {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 8px;
  }

  .result.prime .result-label { color: var(--prime); }
  .result.composite .result-label { color: var(--composite); }

  .result-detail {
    color: var(--text-muted);
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .result-detail strong { color: var(--text); font-weight: 600; }

  .factors {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .factors-title {
    color: var(--text-muted);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }

  .factor-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .factor-tag {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.85rem;
    color: var(--text);
  }

  .error {
    margin-top: 12px;
    color: var(--composite);
    font-size: 0.85rem;
    display: none;
    padding: 8px 12px;
    background: rgba(248, 81, 73, 0.08);
    border-radius: 6px;
    border: 1px solid rgba(248, 81, 73, 0.15);
  }

  .error.visible { display: block; }

  .stats-row {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.8rem;
  }

  .stats-row span { font-family: 'SF Mono', 'Fira Code', monospace; }

  .info-card {
    margin-top: 24px;
    padding: 16px;
    background: rgba(88, 166, 255, 0.04);
    border: 1px solid rgba(88, 166, 255, 0.12);
    border-radius: 10px;
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .info-card strong { color: var(--text); }

  .seed-input {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .seed-input input {
    width: 72px;
    flex-shrink: 0;
  }

  .seed-input button {
    padding: 14px 16px;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Prime Checker</h1>
      <p class="subtitle">Enter a number to test whether it's prime.</p>

      <div class="input-group">
        <input type="number" id="numInput" placeholder="e.g. 97" min="0" step="1" autofocus>
        <button id="checkBtn">Check</button>
      </div>

      <div id="errorMsg" class="error"></div>

      <div id="resultPrime" class="result prime">
        <div class="result-label">Prime</div>
        <div class="result-detail" id="primeDetail"></div>
      </div>

      <div id="resultComposite" class="result composite">
        <div class="result-label">Composite</div>
        <div class="result-detail" id="compositeDetail"></div>
        <div class="factors" id="factorsBox" style="display:none;">
          <div class="factors-title">Factors</div>
          <div class="factor-list" id="factorList"></div>
        </div>
      </div>

      <div class="stats-row">
        <span id="checkCount">Checks: 0</span>
        <span id="lastResult">—</span>
      </div>

      <div class="info-card">
        <strong>What is a prime number?</strong> A prime is a natural number greater than 1 that has exactly two divisors: 1 and itself. Numbers like 2, 3, 5, 7, 11 are prime. 1 is neither prime nor composite.
      </div>
    </div>
  </div>

<script>
(function() {
  const input = document.getElementById('numInput');
  const checkBtn = document.getElementById('checkBtn');
  const errorMsg = document.getElementById('errorMsg');
  const resultPrime = document.getElementById('resultPrime');
  const resultComposite = document.getElementById('resultComposite');
  const primeDetail = document.getElementById('primeDetail');
  const compositeDetail = document.getElementById('compositeDetail');
  const factorsBox = document.getElementById('factorsBox');
  const factorList = document.getElementById('factorList');
  const checkCountEl = document.getElementById('checkCount');
  const lastResultEl = document.getElementById('lastResult');

  let checkCount = 0;
  let lastResult = '—';

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('visible');
  }
  function hideError() {
    errorMsg.classList.remove('visible');
    errorMsg.textContent = '';
  }

  function hideResults() {
    resultPrime.style.display = 'none';
    resultComposite.style.display = 'none';
    factorsBox.style.display = 'none';
  }

  function getFactors(n) {
    const factors = [];
    for (let i = 1; i <= n; i++) {
      if (n % i === 0) factors.push(i);
    }
    return factors;
  }

  function prevPrime(n) {
    for (let i = n - 1; i >= 2; i--) {
      if (isPrime(i)) return i;
    }
    return null;
  }

  function nextPrime(n) {
    for (let i = n + 1; ; i++) {
      if (isPrime(i)) return i;
    }
  }

  function isPrime(n) {
    if (n < 2) return false;
    if (n === 2 || n === 3) return true;
    if (n % 2 === 0 || n % 3 === 0) return false;
    for (let i = 5; i * i <= n; i += 6) {
      if (n % i === 0 || n % (i + 2) === 0) return false;
    }
    return true;
  }

  function check() {
    hideError();
    hideResults();

    const raw = input.value.trim();
    if (raw === '') {
      showError('Please enter a number.');
      return;
    }

    const n = Number(raw);
    if (!Number.isInteger(n) || isNaN(n)) {
      showError('Enter a valid whole number.');
      return;
    }
    if (n < 0) {
      showError('Negative numbers cannot be prime.');
      return;
    }
    if (n > 999999999999999) {
      showError('Number is too large (max 999,999,999,999,999).');
      return;
    }

    checkCount++;
    checkCountEl.textContent = 'Checks: ' + checkCount;

    if (n === 0 || n === 1) {
      resultComposite.style.display = 'block';
      compositeDetail.innerHTML = '<strong>' + n + '</strong> is neither prime nor composite.';
      lastResult = n + ' — neither';
      lastResultEl.textContent = lastResult;
      return;
    }

    if (isPrime(n)) {
      resultPrime.style.display = 'block';
      const prev = prevPrime(n);
      const next = nextPrime(n);
      let detail = '<strong>' + n + '</strong> is a prime number.';
      if (prev !== null) detail += ' Previous prime: <strong>' + prev + '</strong>.';
      if (next !== null) detail += ' Next prime: <strong>' + next + '</strong>.';
      primeDetail.innerHTML = detail;
      lastResult = n + ' — prime';
      lastResultEl.textContent = lastResult;
    } else {
      resultComposite.style.display = 'block';
      compositeDetail.innerHTML = '<strong>' + n + '</strong> is composite — it has divisors other than 1 and itself.';
      const factors = getFactors(n);
      if (factors.length > 0) {
        factorsBox.style.display = 'block';
        factorList.innerHTML = factors.map(f => '<span class="factor-tag">' + f + '</span>').join('');
      }
      lastResult = n + ' — composite';
      lastResultEl.textContent = lastResult;
    }
  }

  checkBtn.addEventListener('click', check);

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') check();
  });

  input.addEventListener('input', hideError);
})();
</script>
</body>
</html>
